[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-worker"
version = "0.1.0"
description = "Playwright browser worker for the Discord → NotebookLM podcast pipeline."
requires-python = ">=3.12"
dependencies = [
    "playwright==1.50.*",
    "google-genai==2.6.0",
    "redis",
    "psycopg[binary]>=3",
    "structlog",
    "httpx",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pylint",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
